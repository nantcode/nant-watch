AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NantWatch (Project 4) - read-only market breakdowns posted to Discord. Never places orders.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 512
    CodeUri: src/
    Environment:
      Variables:
        ALPACA_KEY_ID_PARAM: /nant-trading-bot/alpaca_key_id
        ALPACA_SECRET_KEY_PARAM: /nant-trading-bot/alpaca_secret_key
        DISCORD_WEBHOOK_PARAM: /nant-watch/discord_webhook_url
        SPARTICUS_KEY_ID_PARAM: /nant-watch/sparticus_key_id
        SPARTICUS_SECRET_KEY_PARAM: /nant-watch/sparticus_secret_key

Resources:
  DailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nant-watch-daily
      Description: Weekday posts - 9:30 open review, 11/12/2 race updates, 4:00 close review (read-only)
      Handler: app.daily_handler
      Timeout: 300
      EventInvokeConfig:
        MaximumRetryAttempts: 0   # a failed run alerts once instead of retrying and double-posting
      Policies:
        - Statement:
            - Sid: ReadOnlyTheFiveSecretsWeNeed
              Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-trading-bot/alpaca_key_id
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-trading-bot/alpaca_secret_key
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/discord_webhook_url
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/sparticus_key_id
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/sparticus_secret_key
      Events:
        MarketOpen:
          Type: ScheduleV2
          Properties:
            Name: nant-watch-open
            ScheduleExpression: cron(30 9 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"source": "schedule", "mode": "open"}'
        RaceUpdates:
          Type: ScheduleV2
          Properties:
            Name: nant-watch-race
            ScheduleExpression: cron(0 11,12,14 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"source": "schedule", "mode": "race"}'
        MarketClose:
          Type: ScheduleV2
          Properties:
            Name: nant-watch-close
            ScheduleExpression: cron(0 16 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"source": "schedule", "mode": "close"}'

  WeeklyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nant-watch-weekly
      Description: Saturday weekly breakdown + race scoreboard to Discord (read-only)
      Handler: app.weekly_handler
      Timeout: 600
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - Statement:
            - Sid: ReadOnlyTheFiveSecretsWeNeed
              Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-trading-bot/alpaca_key_id
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-trading-bot/alpaca_secret_key
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/discord_webhook_url
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/sparticus_key_id
                - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nant-watch/sparticus_secret_key
      Events:
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            Name: nant-watch-weekly
            ScheduleExpression: cron(0 9 ? * SAT *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"source": "schedule"}'

  DailyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nant-watch-daily
      RetentionInDays: 14

  WeeklyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nant-watch-weekly
      RetentionInDays: 14

  # ---------- M8: alarms that email you when a run fails ----------

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: nant-watch-alerts
      Subscription:
        - Protocol: email
          Endpoint: '{{resolve:ssm:/nant-watch/alert_email}}'   # kept in SSM so your email never lands in git

  DailyErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nant-watch-daily-errors
      AlarmDescription: A NantWatch weekday run failed. Check /aws/lambda/nant-watch-daily
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: DailyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlertsTopic

  WeeklyErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nant-watch-weekly-errors
      AlarmDescription: The NantWatch weekly Lambda failed. Check /aws/lambda/nant-watch-weekly
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: WeeklyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlertsTopic

Outputs:
  DailyFunctionName:
    Description: Lambda that builds and posts the five weekday posts
    Value:
      Ref: DailyFunction
  WeeklyFunctionName:
    Description: Lambda that builds and posts the weekly breakdown + race scoreboard
    Value:
      Ref: WeeklyFunction
  DailyLogGroupName:
    Description: Where the weekday run logs go
    Value:
      Ref: DailyLogGroup
  WeeklyLogGroupName:
    Description: Where the weekly run logs go
    Value:
      Ref: WeeklyLogGroup
  AlertsTopicArn:
    Description: SNS topic that emails you when a run fails
    Value:
      Ref: AlertsTopic
